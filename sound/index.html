<style>
:root{--bg:#14151E;--card:#1E2030;--line:#33364A;--ink:#F3F1EA;--soft:#A9A8B8;--acc:#5EC8C0;--ok:#5BC08A;--bad:#E5675A;--g:#5EC8C0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:12px 16px 120px}
h1{font-size:20px;margin:6px 0 12px}h1 b{color:var(--acc)}
h2{font-size:15px;margin:0 0 10px;color:var(--soft);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top a{color:var(--soft);text-decoration:none;font-size:14px;padding:10px 4px}
.lang{display:flex;gap:4px}.lang button{background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:6px 9px;font:600 13px system-ui;min-height:34px}.lang button[aria-pressed=true]{background:var(--acc);color:#14151E;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button{font:inherit;cursor:pointer}
.btn{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#272A3D;color:var(--ink);font-weight:700;min-height:46px}
.btn.big{flex:1;padding:16px}.btn.acc{background:var(--acc);color:#14151E;border-color:var(--acc)}.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);font-weight:600;font-size:14px;min-height:38px}
.chip[aria-pressed=true]{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#14151E}
.lbl{font-size:13px;color:var(--soft);margin:6px 0 6px}
.muted{color:var(--soft);font-size:14px}
.big-time{font:700 44px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;margin:8px 0}
.meter{height:10px;background:#272A3D;border-radius:6px;overflow:hidden;margin:6px 0 12px}.meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .06s}
canvas{display:block;width:100%;border-radius:10px;background:#171826;touch-action:none}
#ov{height:46px;margin-bottom:8px}#det{height:140px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{position:relative;aspect-ratio:1/0.82;border-radius:12px;border:1px solid var(--line);background:#191A28;color:var(--soft);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;user-select:none}
.tile small{font-weight:500;font-size:11px;opacity:.8}
.tile.full{background:var(--g);color:#14151E;border-color:var(--g)}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.tile.keep::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#14151E}
.tile.busy{opacity:.55}
.sub{font-size:12px;color:var(--soft);margin:10px 0 6px}
.slider{display:grid;grid-template-columns:84px 1fr 48px;gap:8px;align-items:center;margin:6px 0}
.slider span{font-size:14px;color:var(--soft)}.slider output{font:600 13px ui-monospace,monospace;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc)}
select,input[type=number]{background:#272A3D;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;min-height:40px}
details summary{cursor:pointer;color:var(--soft);font-weight:600;padding:8px 0}
.name{font:800 22px/1.2 system-ui;margin:2px 0 8px;color:var(--ink)}
.cand{min-width:42px}
#busy{position:fixed;inset:0;background:rgba(10,10,16,.78);display:flex;align-items:center;justify-content:center;z-index:50}
#busy div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;text-align:center;min-width:240px}
#busy b{display:block;font-size:18px;margin-bottom:6px}
.bar{height:6px;background:#272A3D;border-radius:4px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#272A3D;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:92vw}
#toast.on{opacity:1;pointer-events:auto}#toast button{background:transparent;border:0;color:var(--acc);font-weight:700}
footer{color:var(--soft);font-size:13px;text-align:center;padding:24px 0 96px}
.warn{color:#F2C14E;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<main>
<div class="top"><h1>Divine <b>Sound</b> Machine</h1><div class="lang" role="group" aria-label="Language / Taal"><button type="button" data-l="en">EN</button><button type="button" data-l="nl">NL</button></div><a href="../" data-tt="back">&larr; Suite</a></div>

<section class="card" id="cSrc">
  <h2 data-t="h1"></h2>
  <div id="srcIdle">
    <div class="row"><button class="btn big rec" id="bRec" type="button" data-t="rec"></button><button class="btn big" id="bImp" type="button" data-t="imp"></button></div>
    <input type="file" id="file" accept="audio/*,video/*" hidden>
    <p class="muted" data-t="srcHint"></p>
  </div>
  <div id="srcRec" hidden>
    <div class="big-time" id="recTime">0:00</div>
    <div class="meter"><i id="recLvl"></i></div>
    <button class="btn big rec" id="bStop" type="button" data-t="stop" style="width:100%"></button>
  </div>
  <div id="srcDone" hidden>
    <div class="row"><span id="srcInfo" class="muted"></span><span class="sp"></span><button class="btn small" id="bNewSrc" type="button" data-t="newSrc"></button></div>
    <p class="warn" id="srcWarn" hidden></p>
  </div>
</section>

<section class="card" id="cDir" hidden>
  <h2 data-t="h2"></h2>
  <div class="lbl" data-t="genre"></div><div class="chips" id="genres"></div>
  <div class="lbl" data-t="mood"></div><div class="chips" id="moods"></div>
  <div class="lbl" data-t="verb"></div><div class="chips" id="verbs"></div>
  <div class="row" style="margin-bottom:6px"><label class="row"><input type="checkbox" id="delay" checked> <span data-t="delay"></span></label></div>
  <details><summary data-t="more"></summary>
    <div class="row" style="margin:6px 0"><span class="muted" data-t="key"></span><select id="key"></select><select id="scale"></select></div>
    <div class="row" style="margin:6px 0"><span class="muted" data-t="tempo"></span><input type="number" id="bpm" min="50" max="200" step="1" style="width:90px"> <span class="muted">BPM</span></div>
    <div class="row" style="margin:6px 0"><span class="muted" data-t="variants"></span><select id="vars"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    <label class="row" style="margin:6px 0"><input type="checkbox" id="both" checked> <span data-t="both"></span></label>
    <label class="row" style="margin:6px 0"><input type="checkbox" id="raw" checked> <span data-t="rawOpt"></span></label>
    <label class="row" style="margin:6px 0"><input type="checkbox" id="clean" checked> <span data-t="clean"></span></label>
  </details>
  <div class="row" style="margin-top:10px"><button class="btn big acc" id="bAuto" type="button" data-t="auto"></button></div>
  <div class="row" style="margin-top:8px"><button class="btn big" id="bGuide" type="button" data-t="guide"></button></div>
</section>

<section class="card" id="cPack" hidden>
  <h2 data-t="h3"></h2>
  <div class="row"><div class="name" id="pName"></div><span class="sp"></span><button class="btn small" id="bName" type="button" data-t="newName"></button></div>
  <div class="muted" id="pInfo" style="margin-bottom:10px"></div>
  <div class="grid" id="grid"></div>
  <div class="sub" data-t="extras"></div>
  <div class="grid" id="xgrid"></div>
  <p class="muted" data-t="tileHint" style="margin-top:10px"></p>
  <div class="row" style="margin-top:6px"><button class="btn big" id="bAgain" type="button" data-t="again"></button></div>
</section>

<section class="card" id="cEd" hidden>
  <div class="row"><h2 id="edTitle" style="margin:0;text-transform:none;color:var(--ink);font-size:17px"></h2><span class="sp"></span><span class="muted" id="edStep"></span></div>
  <p class="muted" id="edSrc" style="margin:6px 0 10px"></p>
  <div class="row"><button class="btn big acc" id="bPlayMade" type="button" data-t="playMade"></button><button class="btn big" id="bPlayRaw" type="button" data-t="playRaw"></button></div>
  <div class="lbl" data-t="cands" style="margin-top:12px"></div>
  <div class="chips" id="cands"></div>
  <div class="slider"><span data-t="sPitch"></span><input type="range" id="sPitch" min="-12" max="12" step="1" value="0"><output id="oPitch">0</output></div>
  <div class="slider"><span data-t="sLen"></span><input type="range" id="sLen" min="0.5" max="2" step="0.05" value="1"><output id="oLen">1.00</output></div>
  <div class="slider"><span data-t="sDrive"></span><input type="range" id="sDrive" min="-1" max="1" step="0.05" value="0"><output id="oDrive">0</output></div>
  <div class="slider"><span data-t="sVerb"></span><input type="range" id="sVerb" min="0" max="1" step="0.05" value="0.5"><output id="oVerb">0.50</output></div>
  <div class="row" style="margin:8px 0"><label class="row"><input type="checkbox" id="sRev"> <span data-t="sRev"></span></label><span class="sp"></span><label class="row"><input type="checkbox" id="sKeep"> <span data-t="keep"></span></label></div>
  <div class="row"><button class="btn" id="bVary" type="button" data-t="vary"></button><button class="btn" id="bPick" type="button" data-t="pick"></button><span class="sp"></span><button class="btn acc" id="bNext" type="button" data-t="next" hidden></button></div>
</section>

<section class="card" id="cWave" hidden>
  <h2 data-t="h4"></h2>
  <canvas id="ov" aria-label="overview"></canvas>
  <canvas id="det" aria-label="detail"></canvas>
  <div class="row" style="margin:8px 0"><button class="btn small" id="zOut" type="button">&minus;</button><span class="muted" id="zInfo"></span><button class="btn small" id="zIn" type="button">+</button><span class="sp"></span><button class="btn small" id="bPlaySel" type="button" data-t="playSel"></button></div>
  <p class="muted" data-t="waveHint"></p>
  <div class="lbl" data-t="makeThis"></div>
  <div class="chips" id="assign"></div>
</section>

<section class="card" id="cExp" hidden>
  <h2 data-t="h5"></h2>
  <div class="row"><button class="btn big acc" id="bZip" type="button" data-t="zip"></button><button class="btn big" id="bLoose" type="button" data-t="loose"></button></div>
  <p class="muted" id="expInfo" style="margin-top:8px"></p>
  <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn small" id="bClear" type="button" data-t="clear"></button></div>
</section>

<footer>Divine Monday &middot; <span data-t="foot"></span></footer>
</main>
<div id="busy" hidden><div><b id="busyT"></b><span class="muted" id="busyS"></span><div class="bar"><i id="busyB"></i></div></div></div>
<div id="toast"><span id="toastT"></span><button type="button" id="toastU" hidden></button></div>

      if (res.wet) { if (S.both) out.push({ name: N + '/' + folder + '/' + base + ' Dry.wav', ch: res.dry }); out.push({ name: N + '/' + folder + '/' + base + ' Wet.wav', ch: res.wet }); }
      else out.push({ name: N + '/' + folder + '/' + base + '.wav', ch: res.dry });
      if (v === 0 && S.raw && res.raw) out.push({ name: N + '/Pure/' + N + ' ' + fName(s.id) + ' Pure.wav', ch: res.raw });
      k++;
    }
  }
  return out;
}
