<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Maak een nieuw schilderij met figuren uit 19.000 jaar kunst: van de grot van Lascaux tot Mondriaan. Slepen, draaien, spiegelen, downloaden. Door Divine Monday.">
<meta name="author" content="Divine Monday"><meta name="theme-color" content="#0B0E14">
<title>Divine Collage</title>
<style>
:root{color-scheme:dark;--bg:#0B0E14;--card:#131824;--card2:#1A2030;--line:#263044;--tx:#EDE6D8;--mu:#9AA3B2;--gold:#E7B65C;--blue:#7FB3E0}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font:italic 700 24px "Bodoni 72",Didot,Georgia,serif}.logo i{color:var(--gold)}
.back{color:var(--mu);text-decoration:none;font-size:13px}.g{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{background:none;border:0;color:var(--mu);padding:7px 12px;cursor:pointer;font:inherit}.seg button.on{background:var(--card2);color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:9px;padding:7px 12px;cursor:pointer;font:inherit;min-height:36px}
.btn.gold{border-color:#5C4A22;background:#2A2416;color:var(--gold);font-weight:600}
.btn[disabled]{opacity:.4;cursor:default}
.main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
.side{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.h{font:italic 600 15px Georgia,serif;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:none;color:var(--mu);border-radius:14px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}.chips button.on{border-color:var(--gold);color:var(--gold)}
.tl{position:relative;display:flex;flex-direction:column;gap:2px;padding-left:18px}.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl button{position:relative;background:none;border:0;color:var(--mu);text-align:left;font:inherit;padding:3px 0;cursor:pointer}.tl button:before{content:"";position:absolute;left:-17px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--line)}
.tl button.on{color:var(--gold);font-weight:600}.tl button.on:before{background:var(--gold)}
select{background:#0F131C;border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-height:38px;color:var(--tx);font:inherit;width:100%}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.it{aspect-ratio:1;background:#131824;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;cursor:grab;padding:5px;touch-action:none}
.it:hover{border-color:#3C4A66}.it img{max-width:100%;max-height:100%;pointer-events:none}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;min-width:0;background:repeating-conic-gradient(#0E121A 0 25%,#0B0E14 0 50%) 0 0/24px 24px}
.wrap{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{box-shadow:0 10px 40px #0009;border-radius:3px;touch-action:none;background:#E9DFC9;max-width:100%;max-height:100%}
.tool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.info{position:absolute;left:24px;bottom:84px;font-size:12.5px;background:#0B0E14dd;border:1px solid var(--line);color:var(--tx);padding:7px 10px;border-radius:8px;max-width:60%;pointer-events:none}
.info b{color:var(--gold);font-weight:600}
.hint{color:var(--mu);font-size:12.5px}
@media (max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.info{bottom:120px}}
</style></head><body>
<div class="top"><div class="logo">Divine <i>Collage</i></div><a class="back" href="/">← alle machines</a><div class="g"></div>
  <div class="seg" id="ratio"><button data-r="w" class="on">16:9</button><button data-r="t">9:16</button></div>
  <button class="btn" id="clear">Leeg</button><button class="btn gold" id="dl">Download</button></div>
<div class="main">
 <div class="side">
  <div class="h">Wat</div><div class="chips" id="cats"></div>
  <div class="h">Tijd</div><div class="tl" id="tl"></div>
  <div class="h">Kunstenaar</div><select id="artist"></select>
  <div class="h" id="gridT"></div><div class="hint">Klik of sleep een stukje op het canvas.</div><div class="grid" id="grid"></div>
 </div>
 <div class="stage"><div class="wrap" id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
  <div class="info" id="info" hidden></div>
  <div class="tool" id="tool">
   <button class="btn" data-a="flip">Spiegelen</button><button class="btn" data-a="rot">Draaien</button><button class="btn" data-a="big">Groter</button><button class="btn" data-a="small">Kleiner</button>
   <button class="btn" data-a="up">Naar voren</button><button class="btn" data-a="down">Naar achteren</button><button class="btn" data-a="alpha">Doorzichtig</button><button class="btn" data-a="dup">Nog een</button><button class="btn" data-a="del">Weg</button></div>
 </div>
</div>
<script>
const $ = (q) => document.querySelector(q), cv = $('#cv'), ctx = cv.getContext('2d');
const CATS = [['mensen', 'Mensen'], ['dieren', 'Dieren'], ['gebouwen', 'Gebouwen'], ['natuur', 'Natuur'], ['dingen', 'Dingen'], ['vormen', 'Vormen'], ['luchten', 'Luchten'], ['grond', 'Grond'], ['achtergronden', 'Achtergronden']];
const S = { items: [], cat: 'mensen', year: null, artist: '', objs: [], bg: null, sel: null, imgs: {} };
const yearTxt = (y) => y < 0 ? (-y).toLocaleString('nl-NL') + ' v.Chr.' : String(y);
function img(id, cb) { if (S.imgs[id]) { if (S.imgs[id].complete) cb && cb(S.imgs[id]); else S.imgs[id].addEventListener('load', () => cb && cb(S.imgs[id])); return S.imgs[id]; }
  const im = new Image(); im.onload = () => { cb && cb(im); draw(); }; im.src = 'art/' + id + '.webp'; S.imgs[id] = im; return im; }

/* ---------- the library on the left ---------- */
function filtered() { return S.items.filter((x) => x.cat === S.cat && (S.year == null || x.year === S.year) && (!S.artist || x.artist === S.artist)); }
function drawSide() {
  $('#cats').innerHTML = ''; CATS.forEach(([k, n]) => { if (!S.items.some((x) => x.cat === k)) return; const b = document.createElement('button'); b.textContent = n; b.className = k === S.cat ? 'on' : ''; b.onclick = () => { S.cat = k; drawSide(); }; $('#cats').append(b); });
  const years = [...new Set(S.items.map((x) => x.year))].sort((a, b) => a - b); $('#tl').innerHTML = '';
  const all = document.createElement('button'); all.textContent = 'Alle tijden'; all.className = S.year == null ? 'on' : ''; all.onclick = () => { S.year = null; drawSide(); }; $('#tl').append(all);
  years.forEach((y) => { const b = document.createElement('button'); b.textContent = S.items.find((x) => x.year === y).yl; b.className = S.year === y ? 'on' : ''; b.onclick = () => { S.year = y; S.artist = ''; drawSide(); }; $('#tl').append(b); });
  const arts = [...new Map(S.items.filter((x) => S.year == null || x.year === S.year).map((x) => [x.artist, x])).values()].sort((a, b) => a.year - b.year);
  $('#artist').innerHTML = '<option value="">Alle kunstenaars</option>' + arts.map((a) => '<option value="' + a.artist + '"' + (a.artist === S.artist ? ' selected' : '') + '>' + a.artist + ', ' + a.title + ' (' + a.yl + ')</option>').join('');
  const list = filtered(), g = $('#grid'); g.innerHTML = ''; $('#gridT').textContent = CATS.find((c) => c[0] === S.cat)[1] + ' (' + list.length + ')';
  list.forEach((x) => { const d = document.createElement('div'); d.className = 'it'; d.title = x.label + ', ' + x.artist + ', ' + x.yl; d.innerHTML = '<img loading="lazy" alt="">'; d.firstChild.src = 'art/' + x.id + '_t.webp';
    d.onpointerdown = (e) => startDrag(e, x); g.append(d); });
  if (!list.length) g.innerHTML = '<div class="hint" style="grid-column:1/-1">Hier is in deze tijd nog niks van.</div>'; }
$('#artist').onchange = () => { S.artist = $('#artist').value; drawSide(); };

/* ---------- placing ---------- */
function add(x, px, py) {
  if (x.cat === 'achtergronden') { S.bg = { item: x }; img(x.id, () => draw()); draw(); return; }
  const W = cv.width, H = cv.height, fit = Math.min(W * (x.cat === 'luchten' || x.cat === 'grond' ? 1 : 0.35) / x.w, H * (x.cat === 'luchten' || x.cat === 'grond' ? 1 : 0.55) / x.h);
  const wide = x.cat === 'luchten' || x.cat === 'grond', o = { item: x, x: px == null ? W / 2 : px, y: py == null ? H / 2 : py, s: wide ? fit : Math.min(fit, 1), r: 0, f: 1, a: 1 };   // never blown up: a piece arrives sharp, at most its own size
  if (x.cat === 'luchten' && py == null) { o.s = W / x.w; o.y = x.h * o.s / 2; }
  if (x.cat === 'grond' && py == null) { o.s = W / x.w; o.y = H - x.h * o.s / 2; }
  img(x.id); const low = x.cat === 'luchten' || x.cat === 'grond'; if (low) S.objs.unshift(o); else S.objs.push(o); S.sel = o; draw(); }
function startDrag(e, x) { e.preventDefault(); const sx = e.clientX, sy = e.clientY; let ghost = null, moved = false;
  const mv = (ev) => { if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) { moved = true; ghost = document.createElement('img'); ghost.src = 'art/' + x.id + '_t.webp'; ghost.style.cssText = 'position:fixed;width:90px;pointer-events:none;opacity:.85;z-index:9;transform:translate(-50%,-50%)'; document.body.append(ghost); }
    if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; } };
  const up = (ev) => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); if (ghost) ghost.remove();
    if (!moved) { add(x); return; } const p = toCanvas(ev); if (p.x >= 0 && p.y >= 0 && p.x <= cv.width && p.y <= cv.height) add(x, p.x, p.y); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up); }

/* ---------- drawing ---------- */
function corners(o) { const w = o.item.w * o.s / 2, h = o.item.h * o.s / 2, c = Math.cos(o.r), s = Math.sin(o.r);
  return [[-w, -h], [w, -h], [w, h], [-w, h]].map(([x, y]) => [o.x + x * c - y * s, o.y + x * s + y * c]); }
function rotKnob(o) { const h = o.item.h * o.s / 2 + 46 * k(); return [o.x + h * Math.sin(o.r), o.y - h * Math.cos(o.r)]; }
const k = () => cv.width / cv.getBoundingClientRect().width;   // canvas pixels per screen pixel
function paint(c, W, H, ui) {
  c.fillStyle = '#E9DFC9'; c.fillRect(0, 0, W, H);
  if (S.bg) { const im = S.imgs[S.bg.item.id]; if (im && im.complete) { const sc = Math.max(W / im.width, H / im.height); c.drawImage(im, (W - im.width * sc) / 2, (H - im.height * sc) / 2, im.width * sc, im.height * sc); } }
  S.objs.forEach((o) => { const im = S.imgs[o.item.id]; if (!im || !im.complete) return; c.save(); c.globalAlpha = o.a; c.translate(o.x, o.y); c.rotate(o.r); c.scale(o.f * o.s, o.s); c.drawImage(im, -o.item.w / 2, -o.item.h / 2, o.item.w, o.item.h); c.restore(); });
  if (ui && S.sel) { const o = S.sel, p = corners(o), kk = k(); c.save(); c.strokeStyle = '#7FB3E0'; c.lineWidth = 2 * kk; c.setLineDash([8 * kk, 6 * kk]); c.beginPath(); p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#7FB3E0'; p.forEach(([x, y]) => c.fillRect(x - 7 * kk, y - 7 * kk, 14 * kk, 14 * kk));
    const [rx, ry] = rotKnob(o), mx = (p[0][0] + p[1][0]) / 2, my = (p[0][1] + p[1][1]) / 2; c.beginPath(); c.moveTo(mx, my); c.lineTo(rx, ry); c.stroke(); c.beginPath(); c.arc(rx, ry, 9 * kk, 0, 7); c.fillStyle = '#0B0E14'; c.fill(); c.stroke(); c.restore(); } }
function draw() { paint(ctx, cv.width, cv.height, true); const o = S.sel, inf = $('#info');
  if (o) { inf.hidden = false; inf.innerHTML = '<b></b> uit <span></span>'; inf.firstChild.textContent = o.item.label; inf.lastChild.textContent = o.item.title + ', ' + o.item.artist + ', ' + o.item.yl; }
  else if (S.bg) { inf.hidden = false; inf.innerHTML = '<b>Achtergrond</b> uit <span></span>'; inf.lastChild.textContent = S.bg.item.title + ', ' + S.bg.item.artist + ', ' + S.bg.item.yl; } else inf.hidden = true;
  document.querySelectorAll('#tool button').forEach((b) => { b.disabled = !S.sel; }); }

/* ---------- touching the canvas: move, scale at a corner, turn at the knob ---------- */
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
function inside(o, p) { const dx = p.x - o.x, dy = p.y - o.y, c = Math.cos(-o.r), s = Math.sin(-o.r), x = dx * c - dy * s, y = dx * s + dy * c; return Math.abs(x) <= o.item.w * o.s / 2 && Math.abs(y) <= o.item.h * o.s / 2; }
let act = null;
cv.addEventListener('pointerdown', (e) => { const p = toCanvas(e), kk = k(); cv.setPointerCapture(e.pointerId);
  if (S.sel) { const o = S.sel, [rx, ry] = rotKnob(o); if (Math.hypot(p.x - rx, p.y - ry) < 22 * kk) { act = { t: 'rot', o, r0: o.r, a0: Math.atan2(p.y - o.y, p.x - o.x) }; return; }
    if (corners(o).some(([x, y]) => Math.hypot(p.x - x, p.y - y) < 20 * kk)) { act = { t: 'scale', o, s0: o.s, d0: Math.hypot(p.x - o.x, p.y - o.y) }; return; } }
  const hit = [...S.objs].reverse().find((o) => inside(o, p)); S.sel = hit || null; if (hit) act = { t: 'move', o: hit, dx: p.x - hit.x, dy: p.y - hit.y }; draw(); });
cv.addEventListener('pointermove', (e) => { if (!act) return; const p = toCanvas(e), o = act.o;
  if (act.t === 'move') { o.x = p.x - act.dx; o.y = p.y - act.dy; }
  if (act.t === 'scale') o.s = Math.max(0.02, act.s0 * Math.hypot(p.x - o.x, p.y - o.y) / act.d0);
  if (act.t === 'rot') { let r = act.r0 + Math.atan2(p.y - o.y, p.x - o.x) - act.a0; const snap = Math.round(r / (Math.PI / 12)) * Math.PI / 12; if (Math.abs(r - snap) < 0.04) r = snap; o.r = r; }
  draw(); });
cv.addEventListener('pointerup', () => { act = null; });
cv.addEventListener('wheel', (e) => { if (!S.sel) return; e.preventDefault(); S.sel.s *= e.deltaY < 0 ? 1.06 : 1 / 1.06; draw(); }, { passive: false });

/* ---------- the tool row ---------- */
const TOOL = { flip: (o) => { o.f *= -1; }, rot: (o) => { o.r += Math.PI / 12; }, big: (o) => { o.s *= 1.15; }, small: (o) => { o.s /= 1.15; },
  up: (o) => { const i = S.objs.indexOf(o); if (i < S.objs.length - 1) { S.objs.splice(i, 1); S.objs.splice(i + 1, 0, o); } },
  down: (o) => { const i = S.objs.indexOf(o); if (i > 0) { S.objs.splice(i, 1); S.objs.splice(i - 1, 0, o); } },
  alpha: (o) => { o.a = o.a > 0.9 ? 0.7 : o.a > 0.6 ? 0.4 : 1; }, dup: (o) => { const c = Object.assign({}, o, { x: o.x + 40, y: o.y + 30 }); S.objs.splice(S.objs.indexOf(o) + 1, 0, c); S.sel = c; },
  del: (o) => { S.objs.splice(S.objs.indexOf(o), 1); S.sel = null; } };
document.querySelectorAll('#tool button').forEach((b) => { b.onclick = () => { if (S.sel) { TOOL[b.dataset.a](S.sel); draw(); } }; });
addEventListener('keydown', (e) => { if (!S.sel || /input|select/i.test(e.target.tagName)) return; if (e.key === 'Delete' || e.key === 'Backspace') { TOOL.del(S.sel); draw(); e.preventDefault(); } });
$('#clear').onclick = () => { S.objs = []; S.bg = null; S.sel = null; draw(); };
document.querySelectorAll('#ratio button').forEach((b) => { b.onclick = () => { const t = b.dataset.r === 't', W = cv.width, H = cv.height, nW = t ? 1080 : 1920, nH = t ? 1920 : 1080;
  if (nW === W) return; S.objs.forEach((o) => { o.x = o.x / W * nW; o.y = o.y / H * nH; }); cv.width = nW; cv.height = nH; document.querySelectorAll('#ratio button').forEach((x) => x.classList.toggle('on', x === b)); fit(); draw(); }; });
function fit() { const r = $('#wrap').getBoundingClientRect(), a = cv.width / cv.height; let w = r.width, h = w / a; if (h > r.height) { h = r.height; w = h * a; } cv.style.width = w + 'px'; cv.style.height = h + 'px'; }
addEventListener('resize', () => { fit(); draw(); });
$('#dl').onclick = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; paint(c.getContext('2d'), c.width, c.height, false);
  c.toBlob((b) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Divine_Collage_' + Date.now().toString(36) + '.png'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }, 'image/png'); };

fetch('items.json').then((r) => r.json()).then((d) => { S.items = d; drawSide(); fit(); draw(); });
</script>
</body></html>
