<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divine Screen Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* One screen: a toolbar on top, a free canvas below where screens float, drag and resize. */
:root{
  --bg:#0d0e12; --wall:#14161c; --panel:#1c1f27; --line:#2b2f3a;
  --fg:#e9e7f2; --dim:#8d8fa0; --accent:#b388ff; --danger:#ff6b81;
  --display:"Unbounded",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-size:15px;letter-spacing:.04em;margin:0 8px 0 0;white-space:nowrap}
h1 span{color:var(--accent)}
form{display:flex;gap:8px;flex:1;min-width:240px}
input{flex:1;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent)}
.primary{background:var(--accent);color:#15101f;border-color:var(--accent);font-size:18px;padding:8px 16px}
#msg{color:var(--danger);font-size:13px;min-height:1em;width:100%}
#msg:empty{display:none}
#wall{position:relative;flex:1;background:var(--wall);overflow:hidden;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);padding:20px}
.empty b{display:block;font-family:var(--display);color:var(--fg);font-size:20px;margin-bottom:8px}
.tile{position:absolute;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tile.top{border-color:var(--accent)}
.bar{display:flex;align-items:center;gap:6px;background:var(--panel);padding:4px 6px;cursor:grab;user-select:none;touch-action:none}
.bar:active{cursor:grabbing}
.grip{color:var(--dim);font-size:16px;padding:0 4px}
.name{flex:1;min-width:0;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{padding:2px 9px;font-size:15px;line-height:1.2;border-radius:6px}
.x:hover{border-color:var(--danger);color:var(--danger)}
.tile iframe{flex:1;width:100%;border:0;display:block}
.shield{position:absolute;inset:0;display:none}
body.moving .shield{display:block}
.size{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 50%,var(--accent) 50%);opacity:.8;border-bottom-right-radius:9px}
.size:hover{opacity:1}
</style>
</head>
<body>
<header>
  <h1>DIVINE <span>SCREEN WALL</span></h1>
  <form id="add">
    <input id="link" type="text" placeholder="Paste a YouTube link" autocomplete="off" aria-label="YouTube link">
    <button class="primary" type="submit" title="Add screen">+</button>
  </form>
  <button id="tidy" type="button" title="Put all screens neatly side by side">Tidy up</button>
  <div id="msg"></div>
</header>
<main id="wall">
  <div class="empty" id="empty"><div><b>Your wall is empty</b>Paste a YouTube link above and press +</div></div>
</main>
<script>
const wall=document.getElementById('wall'), msg=document.getElementById('msg'), empty=document.getElementById('empty');
const KEY='divineScreenWall';
let tiles=[], z=1;

function parse(url){
  url=url.trim();
  if(/^[\w-]{11}$/.test(url)) return {id:url};
  let u; try{u=new URL(url.startsWith('http')?url:'https://'+url)}catch(e){return null}
  const h=u.hostname.replace('www.','').replace('m.','');
  let id=null, list=u.searchParams.get('list');
  if(h==='youtu.be') id=u.pathname.slice(1,12);
  else if(h.endsWith('youtube.com')||h.endsWith('youtube-nocookie.com')){
    id=u.searchParams.get('v');
    const m=u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/);
    if(!id&&m) id=m[2];
  }
  if(id&&/^[\w-]{11}$/.test(id)) return {id};
  if(list) return {list};
  return null;
}
function src(t){
  const base='https://www.youtube-nocookie.com/embed/';
  return t.list? base+'videoseries?list='+encodeURIComponent(t.list)+'&playsinline=1&rel=0'
               : base+t.id+'?playsinline=1&rel=0';
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tiles.map(({el,...t})=>t)))}catch(e){}}
function bounds(){return {w:wall.clientWidth,h:wall.clientHeight}}
function clamp(t){
  const b=bounds();
  t.w=Math.max(200,Math.min(t.w,b.w)); t.h=Math.max(140,Math.min(t.h,b.h));
  t.x=Math.max(0,Math.min(t.x,b.w-t.w)); t.y=Math.max(0,Math.min(t.y,b.h-t.h));
}
function place(t){clamp(t);Object.assign(t.el.style,{left:t.x+'px',top:t.y+'px',width:t.w+'px',height:t.h+'px',zIndex:t.z})}
function front(t){t.z=++z;tiles.forEach(o=>o.el.classList.toggle('top',o===t));place(t)}

function build(t){
  const el=document.createElement('div'); el.className='tile'; t.el=el;
  el.innerHTML=`<div class="bar"><span class="grip">⠿</span><span class="name"></span><button class="x" type="button" title="Remove screen">✕</button></div>
  <iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="shield"></div><div class="size" title="Drag to resize"></div>`;
  el.querySelector('.name').textContent=t.list?'Playlist':t.id;
  el.querySelector('iframe').src=src(t);
  el.querySelector('.x').onclick=e=>{e.stopPropagation();el.remove();tiles=tiles.filter(o=>o!==t);update();save()};
  drag(el.querySelector('.bar'),t,'move'); drag(el.querySelector('.size'),t,'size');
  el.addEventListener('pointerdown',()=>front(t));
  wall.appendChild(el); place(t);
}
function drag(handle,t,mode){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('.x'))return;
    e.preventDefault(); front(t); handle.setPointerCapture(e.pointerId);
    document.body.classList.add('moving');
    const sx=e.clientX, sy=e.clientY, o={...t};
    const mv=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(mode==='move'){t.x=o.x+dx;t.y=o.y+dy}else{t.w=o.w+dx;t.h=o.h+dy}
      place(t);
    };
    const up=()=>{handle.removeEventListener('pointermove',mv);document.body.classList.remove('moving');save()};
    handle.addEventListener('pointermove',mv);
    handle.addEventListener('pointerup',up,{once:true});
    handle.addEventListener('pointercancel',up,{once:true});
  });
}
function tidy(){
  const n=tiles.length; if(!n)return;
  const b=bounds(), g=8; let best={c:1,s:0};
  for(let c=1;c<=n;c++){
    const r=Math.ceil(n/c), w=(b.w-g*(c+1))/c, h=(b.h-g*(r+1))/r;
    const vw=Math.min(w,(h-28)*16/9), s=vw*vw;  /* keep 16:9 video, pick biggest fit */
    if(s>best.s)best={c,s};
  }
  const c=best.c, r=Math.ceil(n/c), w=(b.w-g*(c+1))/c, h=(b.h-g*(r+1))/r;
  tiles.forEach((t,i)=>{t.x=g+(i%c)*(w+g);t.y=g+Math.floor(i/c)*(h+g);t.w=w;t.h=h;place(t)});
  save();
}
function update(){empty.hidden=tiles.length>0}

document.getElementById('add').onsubmit=e=>{
  e.preventDefault(); const inp=document.getElementById('link'); const p=parse(inp.value);
  if(!p){msg.textContent='That link is not a YouTube video. Try a link like youtube.com/watch?v=… or youtu.be/…';return}
  msg.textContent=''; inp.value='';
  const t={...p,x:0,y:0,w:400,h:253,z:++z}; tiles.push(t); build(t); update(); tidy(); front(t);
};
document.getElementById('tidy').onclick=tidy;
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{tiles.forEach(place);save()},150)});

try{(JSON.parse(localStorage.getItem(KEY))||[]).forEach(t=>{if(t.id||t.list){tiles.push(t);z=Math.max(z,t.z||1);build(t)}})}catch(e){}
update();
</script>
</body>
</html>
