<style>
:root{--bg:#14151E;--card:#1E2030;--line:#33364A;--ink:#F3F1EA;--soft:#A9A8B8;--acc:#F2994A;--ok:#5BC08A;--bad:#E5675A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:12px 16px 120px}
h1{font-size:20px;margin:6px 0 12px}
.lang{display:flex;gap:4px}.lang button{background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:6px 9px;font:600 13px system-ui;cursor:pointer;min-height:34px}.lang button[aria-pressed=true]{background:var(--acc);color:#14151E;border-color:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top a{color:var(--soft);text-decoration:none;font-size:14px;padding:10px 4px}.top a:hover{color:var(--ink)}
footer{color:var(--soft);font-size:13px;text-align:center;padding:24px 0 96px}footer a{color:var(--soft)}
h1 b{color:var(--acc)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-weight:700;font-size:15px}
.tabs button small{display:block;font-weight:500;font-size:12px}
.tabs button[aria-pressed=true]{background:var(--acc);color:#14151E;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button{font:inherit;cursor:pointer}
.btn{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#272A3D;color:var(--ink);font-weight:700}
.btn.big{flex:1;padding:16px}
.btn.ok{background:var(--ok);color:#14151E;border-color:var(--ok)}
.btn:disabled{opacity:.4}
.prog{height:8px;border-radius:4px;background:#2A2D40;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--acc)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 6px}
.chip{background:#272A3D;border-radius:12px;padding:12px 2px 8px;text-align:center}
.chip b{display:block;font-size:24px;letter-spacing:.5px}
.chip small{color:var(--soft);font-size:12px}
.chip.on{outline:3px solid var(--acc)}
.free{font-size:22px;font-weight:700;margin:14px 0}
.note{font-size:15px;color:var(--soft)}
.note b{color:var(--ink);font-size:18px}
.rec{width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:var(--bad);display:block;margin:14px auto 8px;box-shadow:0 0 0 0 rgba(229,103,90,.6)}
.rec.live{animation:pulse 1s infinite}
.rec.stop{border-radius:22px;width:80px;height:80px}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(229,103,90,0)}}
.count{text-align:center;font-size:28px;font-weight:800;min-height:38px;border-radius:12px;transition:background .08s}
.count.flash{background:var(--acc);color:#14151E}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.mode button{padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-weight:700;font-size:14px}
.mode button[aria-pressed=true]{background:#272A3D;color:var(--ink);border-color:var(--acc)}
canvas{width:100%;height:70px;display:block;background:#171826;border-radius:10px;margin:8px 0}
.meter{height:10px;border-radius:5px;background:#2A2D40;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s}
.msg{min-height:22px;font-size:14px;color:var(--soft);text-align:center}
.msg.warn{color:var(--acc)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;margin-top:10px}
.list button{height:40px;border-radius:9px;border:1px solid var(--line);background:#272A3D;color:var(--soft);font-size:13px}
.list button.done{background:#24412F;color:var(--ok)}
.list button.cur{outline:2px solid var(--acc)}

<body>
<main>
<div class="top"><h1>Divine <b>Voice</b> Recorder</h1><div class="lang" role="group" aria-label="Language / Taal"><button type="button" data-l="nl">NL</button><button type="button" data-l="en">EN</button></div><a href="../" data-tt="back">&larr; Suite</a></div>

<section class="card" id="setup" hidden>
  <div style="font-weight:800;font-size:18px" data-t="first"></div>
  <p class="tip" data-th="aah"></p>
  <div class="row"><button class="btn big" id="lowBtn" data-t="lowB"></button><button class="btn big" id="highBtn" data-t="highB"></button></div>
  <div class="msg" id="rangeMsg"></div>
  <div class="notes3" id="notes3"></div>
  <p class="tip" data-t="soft"></p>
</section>

<section class="card" id="work">

  <div class="prog"><i id="progBar"></i></div>
  <div id="prompt"></div>
  <p class="tip" id="how"></p>
  <div class="count" id="count"></div>

  <div class="meter"><i id="meter"></i></div>
  <canvas id="wave" width="1000" height="140"></canvas>
  <div class="msg" id="msg"></div>
  <div class="row">
    <button class="btn" id="prevBtn" data-ta="prev">‹</button>
    <button class="btn big" id="playBtn" disabled data-t="listen"></button>
    <button class="btn big ok" id="goodBtn" disabled data-t="good"></button>
    <button class="btn" id="nextBtn" data-ta="next">›</button>
  </div>
  <details style="margin-top:12px"><summary class="tip" data-t="all"></summary><div class="list" id="list"></div></details>
</section>

<section class="card tip">
  <div data-th="howto"></div><div class="row" style="margin-top:10px"><button class="btn" id="redoRange" data-t="redo"></button><button class="btn" id="wipe" style="color:var(--bad)" data-t="wipe"></button></div>
</section>
</main>
<div class="dl"><button class="btn" id="dlBtn">↓ Download</button></div>

let LANG=(()=>{ try{ const v=localStorage.getItem('dvr-lang'); if(v) return JSON.parse(v); }catch(e){} return /^nl/i.test(navigator.language||'')?'nl':'en'; })();
const T=(k)=>I18N[LANG][k];

/* ---------------- recording list ----------------
   our phoneme labels (same as the singer engine) */
const V = ['a','ae','ai','ao','au','e','ei','er','i','ii','oo','ou','u','uu'];
const VS = {a:['ah','father'],ae:['a','cat'],ai:['igh','high'],ao:['uh','cup'],au:['ow','now'],e:['eh','bed'],ei:['ay','day'],er:['er','her'],i:['i','sit'],ii:['ee','see'],oo:['aw','saw'],ou:['oh','go'],u:['oo','book'],uu:['oo','moon']};
const CS = {b:'b',ch:'ch',d:'d',dh:'th',f:'f',g:'g',h:'h',j:'j',k:'k',l:'l',m:'m',n:'n',ng:'ng',p:'p',r:'r',s:'s',sh:'sh',t:'t',th:'th',v:'v',w:'w',y:'y',z:'z'};
const CH = {dh:'this',th:'thin',j:'jam',g:'go',ch:'chin',sh:'she',ng:'sing',y:'yes'};
const ONS = ['b','ch','d','dh','f','g','h','j','k','l','m','n','p','r','s','sh','t','th','v','w','y','z'];
const NOCODA = {h:1,w:1,y:1};
const CLUS_ON = [['b','l'],['b','r'],['d','r'],['f','l'],['f','r'],['g','l'],['g','r'],['k','l'],['k','r'],['k','w'],['p','l'],['p','r'],['s','k'],['s','k','r'],['s','l'],['s','m'],['s','n'],['s','p'],['s','p','l'],['s','p','r'],['s','t'],['s','t','r'],['s','w'],['t','r'],['t','w'],['th','r']];
const CLUS_CO = [['n','d'],['n','t'],['n','z'],['s','t'],['t','s'],['k','s'],['l','d'],['m','z'],['ng','k'],['r','d'],['r','t'],['f','t'],['k','t'],['d','z']];
const groups = [V.slice(0,4),V.slice(4,8),V.slice(8,11),V.slice(11)];
function buildList(){
  const L=[]; let r=0; const rot=(k)=>V[(r+k)%V.length];
  // vowels gliding into each other
  for(const g of groups) L.push(g.map(v=>[[],v,[]]));
  // every consonant before every vowel, legato, last syllable closed
  for(const c of ONS) for(const g of groups){ const s=g.map(v=>[[c],v,[]]); if(!NOCODA[c]) s[s.length-1][2]=[c]; L.push(s); }
  // ng only at the end
  L.push(['a','ae','i','ao'].map(v=>[[],v,['ng']])); L.push(['e','oo','u','ou'].map(v=>[[],v,['ng']]));
  // clusters at the start
  for(const cl of CLUS_ON){ L.push([0,1,2,3].map(k=>[cl,rot(k),[]])); r+=3; }
  // clusters at the end
  const fr=['b','d','k','m'];
  for(const cl of CLUS_CO){ L.push([0,1,2,3].map(k=>[[fr[k]],rot(k),cl])); r+=3; }
  return L;
}
const LIST = buildList();
const FREE = [
  'Twinkle twinkle little star, how I wonder what you are',
  'Row row row your boat, gently down the stream',
  'Mary had a little lamb, its fleece was white as snow',
  'Amazing grace, how sweet the sound',
  'Swing low, sweet chariot, coming for to carry me home',
  'Oh my darling, oh my darling, oh my darling Clementine',
  'Home, home on the range, where the deer and the antelope play',
  'Michael row the boat ashore, hallelujah',
  'Should auld acquaintance be forgot, and never brought to mind',
  'Down in the valley, the valley so low',
  'BREATH'
];
const spell = (s)=>s[0].map(c=>CS[c]).join('')+VS[s[1]][0]+s[2].map(c=>CS[c]).join('');
const hint = (s)=>{ const cs=s[0].concat(s[2]).map(c=>CH[c]).filter(Boolean); return VS[s[1]][1]+(cs.length?' · '+cs[0]:''); };

/* ---------------- state ---------------- */
const TABS=[['low','Laag'],['mid','Midden'],['high','Hoog'],['free','Vrij']]; // the second name is the file name, the same in both languages
const TL=(k)=>T('tabs')[k];
const BPM=90, BEAT=60/BPM;
const store={get:(k,d)=>{try{const v=localStorage.getItem('dvr-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem('dvr-'+k,JSON.stringify(v));}catch(e){}}};
const st={silent:store.get('silent',true),tab:store.get('tab','mid'),idx:store.get('idx',{low:0,mid:0,high:0,free:0}),range:store.get('range',null),notes:store.get('notes',null),done:store.get('done',{}),take:null,rec:false};
const $=(s)=>document.querySelector(s);
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nn=(m)=>NAMES[m%12]+(Math.floor(m/12)-1);
const mtof=(m)=>440*Math.pow(2,(m-69)/12);

/* ---------------- storage of takes (IndexedDB) ---------------- */
let DB=null;
function db(){ if(DB) return Promise.resolve(DB); return new Promise((ok,no)=>{ const r=indexedDB.open('divine-voice',1); r.onupgradeneeded=()=>r.result.createObjectStore('takes'); r.onsuccess=()=>{DB=r.result;ok(DB);}; r.onerror=()=>no(r.error); }); }
async function put(k,v){ const d=await db(); return new Promise((ok,no)=>{ const t=d.transaction('takes','readwrite'); t.objectStore('takes').put(v,k); t.oncomplete=ok; t.onerror=()=>no(t.error); }); }
async function get(k){ const d=await db(); return new Promise((ok)=>{ const r=d.transaction('takes').objectStore('takes').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>ok(null); }); }
async function keys(){ const d=await db(); return new Promise((ok)=>{ const r=d.transaction('takes').objectStore('takes').getAllKeys(); r.onsuccess=()=>ok(r.result||[]); r.onerror=()=>ok([]); }); }

/* ---------------- audio ---------------- */
let ctx=null, stream=null, src=null, proc=null, chunks=null, chunkT0=0, onLevel=null;
async function audio(){
  if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); }
  if(ctx.state!=='running') await ctx.resume();
  if(!stream){
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    src=ctx.createMediaStreamSource(stream); proc=ctx.createScriptProcessor(4096,1,1);
    const mute=ctx.createGain(); mute.gain.value=0; src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    proc.onaudioprocess=(e)=>{ const x=e.inputBuffer.getChannelData(0); if(chunks){ if(!chunks.length) chunkT0=(e.playbackTime!=null?e.playbackTime:ctx.currentTime)-x.length/ctx.sampleRate; chunks.push(new Float32Array(x)); }
      if(onLevel){ let m=0; for(let i=0;i<x.length;i+=4) m=Math.max(m,Math.abs(x[i])); onLevel(m); } };
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  }
}
function click(t,acc){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=acc?1600:1100; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(acc?0.5:0.3,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.06); }
function tone(t,dur,m){ const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=mtof(m); o2.type='triangle'; o2.frequency.value=mtof(m)*2; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.22,t+0.04); g.gain.setValueAtTime(0.22,t+dur-0.08); g.gain.linearRampToValueAtTime(0.0001,t+dur); o.connect(g); o2.connect(g); g.connect(ctx.destination); o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur); }
const join=(cs)=>{ let n=0; for(const c of cs) n+=c.length; const y=new Float32Array(n); let o=0; for(const c of cs){ y.set(c,o); o+=c.length; } return y; };
const wait=(s)=>new Promise(r=>setTimeout(r,s*1000));

/* pitch of a sung "aah": autocorrelation, median over frames */
function pitchOf(x,sr){ const W=2048, out=[]; for(let s=0;s+W<x.length;s+=1024){ let e=0; for(let i=0;i<W;i++) e+=x[s+i]*x[s+i]; if(Math.sqrt(e/W)<0.01) continue;
  let best=0,bl=0; for(let L=Math.floor(sr/1000);L<Math.floor(sr/60);L++){ let a=0; for(let i=0;i<W-L;i+=2) a+=x[s+i]*x[s+i+L]; if(a>best){best=a;bl=L;} } if(bl&&best/e>0.3) out.push(69+12*Math.log2(sr/bl/440)); }
  if(out.length<3) return null; out.sort((a,b)=>a-b); return Math.round(out[Math.floor(out.length/2)]); }

/* ---------------- wav + zip ---------------- */
function wav(x,sr){ const n=x.length, b=new ArrayBuffer(44+n*2), v=new DataView(b); const w=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) v.setInt16(44+i*2,Math.max(-1,Math.min(1,x[i]))*32767,true); return new Uint8Array(b); }
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
const crc32=(u)=>{ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zip(files){ const parts=[], cen=[]; let off=0; const enc=new TextEncoder();
  for(const [name,data] of files){ const nm=enc.encode(name), c=crc32(data), h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint32(14,c,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const cd=new DataView(new ArrayBuffer(46)); cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true); cd.setUint32(16,c,true); cd.setUint32(20,data.length,true); cd.setUint32(24,data.length,true); cd.setUint16(28,nm.length,true); cd.setUint32(42,off,true);
    cen.push(new Uint8Array(cd.buffer),nm); off+=30+nm.length+data.length; }
  let cl=0; for(const c of cen) cl+=c.length; const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cl,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:'application/zip'}); }

/* ---------------- screens ---------------- */
const items=()=>st.tab==='free'?FREE:LIST;
const key=(tab,i)=>tab+'/'+String(i+1).padStart(3,'0');
const curMidi=()=>st.notes?st.notes[st.tab==='free'?'mid':st.tab]:null;
function renderTabs(){ const TB=$('#tabs'); TB.innerHTML=''; for(const [k,lab] of TABS){ const n=k==='free'?FREE.length:LIST.length, d=Object.keys(st.done).filter(x=>x.startsWith(k+'/')).length;
  const b=document.createElement('button'); b.setAttribute('aria-pressed',st.tab===k); b.innerHTML=TL(k)+'<small>'+d+' / '+n+'</small>'; b.onclick=()=>{ if(st.rec) return; st.tab=k; store.set('tab',k); render(); }; TB.append(b); } }
function renderSetup(){ const show=!st.notes||st.redo; $('#setup').hidden=!show; $('#work').hidden=show;
  const r=st.range||{}; $('#rangeMsg').textContent=(r.low?T('lowest')+nn(r.low):'')+(r.low&&r.high?' · ':'')+(r.high?T('highest')+nn(r.high):'');
  const N=$('#notes3'); N.innerHTML=''; if(st.notes){ for(const [k,lab] of TABS.slice(0,3)){ const d=document.createElement('div'); d.innerHTML='<small>'+TL(k)+'</small><b>'+nn(st.notes[k])+'</b>';
      const m=document.createElement('button'); m.textContent='−'; m.onclick=()=>{st.notes[k]--;store.set('notes',st.notes);renderSetup();preview(st.notes[k]);};
      const p=document.createElement('button'); p.textContent='+'; p.onclick=()=>{st.notes[k]++;store.set('notes',st.notes);renderSetup();preview(st.notes[k]);};
      d.append(m,' ',p); N.append(d); }
    const go=document.createElement('button'); go.className='btn ok'; go.style.cssText='grid-column:1/4;width:100%;height:auto;padding:14px;margin-top:4px'; go.textContent=T('ready'); go.onclick=()=>{st.redo=false;render();}; N.append(go); } }
async function preview(m){ await audio(); tone(ctx.currentTime+0.05,0.8,m); }
async function measure(which){ st.redo=true; try{ await audio(); }catch(e){ $('#rangeMsg').textContent=T('nomic'); return; }
  const b=which==='low'?$('#lowBtn'):$('#highBtn'), was=b.textContent; b.textContent=T('singnow'); b.disabled=true; chunks=[]; await wait(3); const x=join(chunks); chunks=null; b.textContent=was; b.disabled=false;
  const m=pitchOf(x,ctx.sampleRate); if(m==null){ $('#rangeMsg').textContent='Ik hoorde geen toon. Nog een keer, iets harder.'; return; }
  st.range=Object.assign({},st.range,{[which]:m}); store.set('range',st.range);
  if(st.range.low&&st.range.high){ let lo=st.range.low+3, hi=st.range.high-3; if(hi-lo<6){ const c=Math.round((st.range.low+st.range.high)/2); lo=c-3; hi=c+3; } st.notes={low:lo,mid:Math.round((lo+hi)/2),high:hi}; store.set('notes',st.notes); }
  renderSetup(); }
function renderWork(){ const it=items(), i=st.idx[st.tab]=Math.min(st.idx[st.tab]||0,it.length-1), m=curMidi();
  $('#lineNo').textContent=(st.tab==='free'?T('phrase'):T('line'))+(i+1)+T('of')+it.length;
  const d=Object.keys(st.done).filter(x=>x.startsWith(st.tab+'/')).length; $('#progBar').style.width=(100*d/it.length)+'%';
  $('#pitchInfo').innerHTML=st.tab==='free'?T('free'):T('note')+'<b>'+nn(m)+'</b>';
  const P=$('#prompt'); P.innerHTML='';
  if(st.tab==='free'){ const f=document.createElement('div'); f.className='free'; f.textContent=it[i]==='BREATH'?T('breath'):it[i]; P.append(f); $('#how').textContent=i===it.length-1?T('breathe'):T('ownway'); }
  else { const c=document.createElement('div'); c.className='chips'; it[i].forEach((s,k)=>{ const e=document.createElement('div'); e.className='chip'; e.id='chip'+k; e.innerHTML='<b>'+spell(s)+'</b><small>'+hint(s)+'</small>'; c.append(e); }); P.append(c);
    $('#how').textContent=T('joined'); }
  const L=$('#list'); L.innerHTML=''; it.forEach((_,k)=>{ const b=document.createElement('button'); b.textContent=k+1; if(st.done[key(st.tab,k)]) b.className='done'; if(k===i) b.classList.add('cur'); b.onclick=()=>go(k); L.append(b); });
  loadTake(); }
async function loadTake(){ const t=await get(key(st.tab,st.idx[st.tab])); st.take=t||null; drawWave(t?t.x:null); $('#playBtn').disabled=!t; $('#goodBtn').disabled=!t; $('#msg').textContent=t?(t.ok?T('approved'):T('recorded')):''; $('#msg').className='msg'; }
const f32=(q)=>{ if(!q||q instanceof Float32Array) return q; const y=new Float32Array(q.length); for(let i=0;i<q.length;i++) y[i]=q[i]/32767; return y; };
function drawWave(x){ x=f32(x); const c=$('#wave'), g=c.getContext('2d'); g.clearRect(0,0,c.width,c.height); if(!x) return; const n=x.length, W=c.width, H=c.height; g.fillStyle='#F2994A';
  for(let p=0;p<W;p++){ let m=0; const a=Math.floor(p*n/W), b=Math.floor((p+1)*n/W); for(let i=a;i<b;i+=8) m=Math.max(m,Math.abs(x[i])); const h=Math.max(1,m*H); g.fillRect(p,(H-h)/2,1,h); } }
function go(k){ if(st.rec) return; st.idx[st.tab]=Math.max(0,Math.min(items().length-1,k)); store.set('idx',st.idx); renderWork(); }
function render(){ $('#mSilent').setAttribute('aria-pressed',!!st.silent); $('#mPhones').setAttribute('aria-pressed',!st.silent); renderTabs(); renderSetup(); if(!$('#work').hidden) renderWork(); $('#dlBtn').textContent='↓ Download '+TL(st.tab)+'.zip'; applyLang(); }

/* ---------------- record one line ---------------- */
async function record(){
  if(st.rec){ st.stopNow&&st.stopNow(); return; }
  try{ await audio(); }catch(e){ $('#msg').textContent=T('nomic'); return; }
  const free=st.tab==='free', m=curMidi(), it=items()[st.idx[st.tab]], R=$('#recBtn'), C=$('#count');
  st.rec=true; R.classList.add('live'); $('#playBtn').disabled=$('#goodBtn').disabled=true; let peak=0; onLevel=(v)=>{ peak=Math.max(peak,v); $('#meter').style.width=Math.min(100,v*120)+'%'; $('#meter').style.background=v>0.95?'var(--bad)':'var(--ok)'; };
  if(!free&&st.silent){ C.textContent=T('hear'); tone(ctx.currentTime+0.05,1.6,m); await wait(1.9); }
  chunks=[]; await wait(0.15); const t0=ctx.currentTime+0.25; let beat1=null, len;
  if(free){ R.classList.add('stop'); C.textContent=T('go'); await new Promise(r=>{ st.stopNow=r; setTimeout(r,25000); }); st.stopNow=null; len=null; }
  else { beat1=t0+4*BEAT; if(!st.silent){ tone(t0,BEAT*2-0.05,m); for(let k=0;k<4;k++) click(t0+k*BEAT,k===0); for(let k=0;k<it.length;k++) click(beat1+k*BEAT,false); }
    const end=beat1+(it.length+2.5)*BEAT;
    const tick=()=>{ if(!st.rec) return; const t=ctx.currentTime; C.classList.toggle('flash',t>=t0&&((t-t0)%BEAT)<0.14&&t<beat1+it.length*BEAT); if(t<beat1){ C.textContent=String(4-Math.floor((t-t0)/BEAT)); } else { const k=Math.floor((t-beat1)/BEAT); C.textContent=k<it.length?spell(it[k]):''; for(let j=0;j<it.length;j++){ const e=$('#chip'+j); if(e) e.classList.toggle('on',j===k); } } if(t<end) requestAnimationFrame(tick); };
    tick(); await wait(end-ctx.currentTime+0.15); }
  C.classList.remove('flash'); const x=join(chunks), sr=ctx.sampleRate, T0=chunkT0; chunks=null; onLevel=null; st.rec=false; R.classList.remove('live','stop'); C.textContent=''; $('#meter').style.width='0';
  for(let j=0;j<4;j++){ const e=$('#chip'+j); if(e) e.classList.remove('on'); }
  const q=new Int16Array(x.length); for(let i=0;i<x.length;i++) q[i]=Math.max(-1,Math.min(1,x[i]))*32767;
  const take={x:q, sr, tab:st.tab, line:st.idx[st.tab]+1, midi:free?null:m, bpm:BPM, beat1:beat1==null?null:Math.round((beat1-T0)*sr), syl:free?null:it, text:free?(it==='BREATH'?I18N.nl.breath:it):it.map(spell).join(' '), silent:!!st.silent, latency:{base:ctx.baseLatency||0,out:ctx.outputLatency||0}, ok:false, when:Date.now()};
  delete st.done[key(st.tab,st.idx[st.tab])]; store.set('done',st.done); renderTabs();
  st.take=take; await put(key(st.tab,st.idx[st.tab]),take); drawWave(x); $('#playBtn').disabled=$('#goodBtn').disabled=false;
  const M=$('#msg'); if(peak>0.97){ M.textContent=T('loud'); M.className='msg warn'; } else if(peak<0.03){ M.textContent=T('quiet'); M.className='msg warn'; } else { M.textContent=T('check'); M.className='msg'; }
}
async function play(){ if(!st.take) return; await audio(); const b=ctx.createBuffer(1,st.take.x.length,st.take.sr); b.copyToChannel(f32(st.take.x),0); const s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(); }
async function good(){ if(!st.take) return; st.take.ok=true; const k=key(st.tab,st.idx[st.tab]); await put(k,st.take); st.done[k]=1; store.set('done',st.done); const n=items().length; let j=st.idx[st.tab]+1; while(j<n&&st.done[key(st.tab,j)]) j++; if(j>=n){ j=0; while(j<n&&st.done[key(st.tab,j)]) j++; } if(j>=n){ $('#msg').textContent=T('done1')+TL(st.tab)+T('done2'); renderTabs(); return; } go(j); renderTabs(); }

async function download(){ const b=$('#dlBtn'); b.textContent=T('packing'); const ks=(await keys()).filter(k=>k.startsWith(st.tab+'/')).sort(); const files=[], meta=[];
  for(const k of ks){ const t=await get(k); if(!t||!t.ok) continue; const name=k.replace('/','_')+'.wav'; files.push([name,wav(f32(t.x),t.sr)]); meta.push({file:name,line:t.line,text:t.text,syl:t.syl,midi:t.midi,bpm:t.bpm,beat1:t.beat1,sr:t.sr,latency:t.latency,silent:!!t.silent}); }
  if(!files.length){ b.textContent=T('nothing'); setTimeout(render,1800); return; }
  files.push(['meta.json',new TextEncoder().encode(JSON.stringify({tab:st.tab,range:st.range,notes:st.notes,ua:navigator.userAgent,takes:meta},null,1))]);
  const z=zip(files), a=document.createElement('a'); a.href=URL.createObjectURL(z); a.download='divine-voice-'+TABS.find(t=>t[0]===st.tab)[1].toLowerCase()+'.zip'; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); render(); }

$('#recBtn').onclick=record; $('#playBtn').onclick=play; $('#goodBtn').onclick=good; $('#prevBtn').onclick=()=>go(st.idx[st.tab]-1); $('#nextBtn').onclick=()=>go(st.idx[st.tab]+1);
$('#lowBtn').onclick=()=>measure('low'); $('#highBtn').onclick=()=>measure('high'); $('#redoRange').onclick=()=>{ st.redo=true; render(); window.scrollTo(0,0); }; $('#dlBtn').onclick=download;
let wipeArm=0; $('#wipe').onclick=async()=>{ const b=$('#wipe'); if(st.rec) return; if(Date.now()-wipeArm>4000){ wipeArm=Date.now(); b.textContent=T('sure'); setTimeout(()=>{ if(Date.now()-wipeArm>=4000) b.textContent=T('wipe'); },4100); return; }
  try{ const d=await db(); await new Promise((ok)=>{ const t=d.transaction('takes','readwrite'); t.objectStore('takes').clear(); t.oncomplete=ok; t.onerror=ok; }); }catch(e){}
  for(const k of ['done','idx','range','notes','tab']) try{ localStorage.removeItem('dvr-'+k); }catch(e){}
  st.done={}; st.idx={low:0,mid:0,high:0,free:0}; st.range=null; st.notes=null; st.tab='mid'; st.take=null; st.redo=false; b.textContent=T('wipe'); render(); window.scrollTo(0,0); }; $('#mSilent').onclick=()=>{ if(st.rec) return; st.silent=true; store.set('silent',true); render(); }; $('#mPhones').onclick=()=>{ if(st.rec) return; st.silent=false; store.set('silent',false); render(); };
function applyLang(){ document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(e=>{ if(!(e.id==='wipe'&&Date.now()-wipeArm<4000)) e.textContent=T(e.dataset.t); });
  document.querySelectorAll('[data-th]').forEach(e=>{ e.innerHTML=T(e.dataset.th); });
  document.querySelectorAll('[data-ta]').forEach(e=>{ e.setAttribute('aria-label',T(e.dataset.ta)); });
  document.querySelectorAll('[data-tt]').forEach(e=>{ e.title=T(e.dataset.tt); });
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG)); }
document.querySelectorAll('.lang button').forEach(b=>{ b.onclick=()=>{ if(st.rec) return; LANG=b.dataset.l; try{ localStorage.setItem('dvr-lang',JSON.stringify(LANG)); }catch(e){} render(); }; });
render();
